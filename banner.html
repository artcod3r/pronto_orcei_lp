<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gerador de Banner ProntoOrcei (1024x500)</title>
    <style>
        body {
            background: #1e1e24;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            max-width: 100%;
            height: auto;
        }

        button {
            margin-top: 24px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            background: #00C853;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #00E676;
            transform: translateY(-2px);
        }

        p {
            color: #aaa;
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <canvas id="banner" width="1024" height="500"></canvas>
    <button id="downloadBtn">Baixar Banner (1024x500 PNG)</button>
    <p>Atende rigorosamente aos padrões do Google Play Console (1024 x 500 px, sem transparência).</p>

    <script>
        const canvas = document.getElementById('banner');
        const ctx = canvas.getContext('2d');

        // 1. Fundo Gradiente (Verde vibrante para azul escuro profundo)
        const gradient = ctx.createLinearGradient(0, 500, 1024, 0);
        gradient.addColorStop(0, '#025930');
        gradient.addColorStop(0.35, '#0b3b32');
        gradient.addColorStop(0.7, '#0f2444');
        gradient.addColorStop(1, '#081226');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1024, 500);

        // Efeitos sutis de iluminação de fundo (glow)
        const glow = ctx.createRadialGradient(512, 180, 20, 512, 180, 350);
        glow.addColorStop(0, 'rgba(0, 200, 83, 0.18)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 1024, 500);

        // 2. Desenho do Ícone Central (Prancheta estilizada)
        const cx = 512;
        const cy = 160;

        ctx.save();
        ctx.translate(cx - 50, cy - 60);

        // Borda da Prancheta
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Retângulo arredondado do corpo da prancheta
        ctx.beginPath();
        ctx.roundRect(0, 18, 100, 115, 14);
        ctx.stroke();

        // Clipe do topo
        ctx.beginPath();
        ctx.roundRect(30, 6, 40, 20, 6);
        ctx.fillStyle = '#0f2444';
        ctx.fill();
        ctx.stroke();

        // Linhas internas simulando o orçamento/tabela
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(20, 42); ctx.lineTo(55, 42);
        ctx.moveTo(65, 42); ctx.lineTo(80, 42);
        ctx.moveTo(20, 54); ctx.lineTo(45, 54);
        ctx.stroke();

        // Bloco central destacado (tabela de itens)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(20, 64, 60, 26);
        ctx.strokeRect(20, 64, 60, 26);

        // Linha inferior
        ctx.beginPath();
        ctx.moveTo(20, 104); ctx.lineTo(48, 104);
        ctx.stroke();

        // Assinatura estilizada em azul
        ctx.strokeStyle = '#38B6FF';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(56, 104);
        ctx.bezierCurveTo(62, 92, 58, 112, 68, 98);
        ctx.bezierCurveTo(74, 95, 76, 104, 82, 102);
        ctx.stroke();

        // Ícone de Check verde (Aprovado / Feito)
        ctx.strokeStyle = '#00E676';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(75, 110);
        ctx.lineTo(92, 128);
        ctx.lineTo(125, 85);
        ctx.stroke();

        ctx.restore();

        // 3. Tipografia: Nome do Aplicativo
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText('ProntoOrcei', 512, 320);

        // 4. Tipografia: Frase de Destaque
        ctx.fillStyle = '#D1D5DB';
        ctx.font = '500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText('Orçamentos em PDF profissionais no seu bolso', 512, 375);

        // 5. Badges/Tags de Funcionalidades (Rodapé limpo)
        const tags = ['Assinatura Digital', 'Pix Dinâmico', '100% Offline'];
        const startX = 330;
        const tagY = 430;

        ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        tags.forEach((tag, idx) => {
            const x = startX + (idx * 180);

            // Fundo do badge
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath();
            ctx.roundRect(x - 70, tagY - 14, 140, 28, 14);
            ctx.fill();

            // Texto do badge
            ctx.fillStyle = '#00E676';
            ctx.fillText(tag, x, tagY);
        });

        // Função de Download do PNG
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'feature-graphic-prontoorcei.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>

</html>
